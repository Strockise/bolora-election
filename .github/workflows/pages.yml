name: Deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: true
jobs:
  # মূল সাইট: https://bolora-hilf-al-fudul.web.app (Firebase Hosting)
  firebase:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1010091225225/locations/global/workloadIdentityPools/github/providers/github-repo
          service_account: gh-deployer@bolora-election.iam.gserviceaccount.com
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npx --yes firebase-tools@13 deploy --only hosting --project bolora-election --non-interactive

  # পুরনো ঠিকানা (strockise.github.io/bolora-election) এখন নতুন ঠিকানায় পাঠিয়ে দেয়
  pages:
    needs: firebase   # নতুন সাইট সফলভাবে চালু হলে তবেই পুরনো ঠিকানা সরানো হবে
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-redirect
      - id: deployment
        uses: actions/deploy-pages@v4
